name: Build PDF artifact
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'build_book.py'
      - '.github/workflows/build-and-commit.yml'
      - 'trigger-build.txt'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install reportlab requests pypdf
      - name: Build
        run: python build_book.py
      - name: Upload PDFs and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-worker-pdf-build
          path: |
            *.pdf
            검증결과.txt
          if-no-files-found: warn
          retention-days: 1
