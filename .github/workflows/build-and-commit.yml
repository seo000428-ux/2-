name: Build and commit PDFs
on:
  push:
    branches: [main]
    paths:
      - 'build_book.py'
      - '.github/workflows/build-and-commit.yml'
      - 'trigger-build.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install reportlab requests pypdf
      - run: python build_book.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.pdf' '검증결과.txt'
          git commit -m 'Generate 2019-2026 social worker exam PDFs' || exit 0
          git push
