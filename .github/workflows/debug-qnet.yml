name: Debug QNet attachment
on:
  pull_request:
    branches: [main]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pypdf
      - run: python debug_qnet.py
